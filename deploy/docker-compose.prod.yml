# Production override for docker-compose.yml.
# Use with:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# Differences from the dev compose file:
#   - Backend runs under gunicorn instead of the Flask dev server.
#   - No source bind-mounts (the image owns the code).
#   - All published ports bind to 127.0.0.1 only — the host nginx is the only
#     thing that talks to the containers from outside.
#   - Postgres has no published port at all.
#   - Every service auto-restarts unless explicitly stopped.
#   - FLASK_ENV=production, debug off, FRONTEND_ORIGIN points at the public domain.
#
# Required additions to server/requirements.txt before this works:
#   gunicorn==23.0.0
#
# Required additional .env vars on the server:
#   PUBLIC_DOMAIN=app.yourdomain.com   # used to build FRONTEND_ORIGIN and CORS

version: "3.8"

services:
  backend:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - FRONTEND_ORIGIN=https://${PUBLIC_DOMAIN}
      - ALPHA_VANTAGE_KEY=${ALPHA_VANTAGE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    # Drop the dev bind-mount: the image's copy of the code is what runs.
    volumes: []
    # Run migrations, then serve under gunicorn.
    # Tune workers to (2 * CPU) + 1 once you know the instance size.
    command: "gunicorn --bind 0.0.0.0:5000 --workers 3 --timeout 120 --access-logfile - --error-logfile - run:app"

  frontend:
    build:
      context: ./client
      args:
        # Built-time baked into the JS bundle. Must be the public URL clients hit.
        - VITE_API_BASE_URL=https://${PUBLIC_DOMAIN}/api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port — db is reachable only over the internal docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
