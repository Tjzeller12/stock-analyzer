# Host-level nginx config — lives on the EC2, NOT inside the frontend container.
# Path: /etc/nginx/sites-available/stock-analyzer
# Then symlink:  sudo ln -s /etc/nginx/sites-available/stock-analyzer /etc/nginx/sites-enabled/
# Replace app.yourdomain.com with your actual domain before reloading.
#
# Flow:
#   client ──443──▶ host nginx ──▶ 127.0.0.1:5173  (frontend container, static React)
#                              └─▶ 127.0.0.1:5001  (Flask/gunicorn under /api/)
#
# TLS blocks below are templates — `sudo certbot --nginx -d app.yourdomain.com`
# will rewrite them correctly on first run. Until you run certbot, only the
# :80 server block will be active; certbot will inject the :443 block and the
# redirect.

# --- HTTP: redirect everything to HTTPS after certbot is configured ---------
server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    # certbot writes its ACME challenge here
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the real server block -------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.yourdomain.com;

    # certbot will populate these paths:
    ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Raise from nginx default 1MB if the app ever accepts uploads
    client_max_body_size 10M;

    # Basic hardening headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- Backend (Flask/gunicorn) ----------
    # Everything under /api/ goes to the backend. We strip the /api/ prefix so
    # your existing Flask routes (/auth/login, /portfolio/add, etc.) keep working.
    location /api/ {
        proxy_pass         http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------- Frontend (static React served by the frontend container) ----
    location / {
        proxy_pass         http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
