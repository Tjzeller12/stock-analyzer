version: "3.8"

services:
  backend:
    build: ./server
    ports:
      - "5001:5000"
    environment:
      - DATABASE_URL=postgresql://zeller:june1200@db:5432/stock_analyzer_database
      - REDIS_URL=redis://redis:6379/0
      - FLASK_APP=run.py
      - FLASK_ENV=development
      - SECRET_KEY=1qaz2wsx3edc4rfv5tgb6yhn7ujm8ik9ol0p
      - FLASK_RUN_HOST=0.0.0.0
      - FRONTEND_ORIGIN=http://3.85.3.252:3000
      - ALPHA_VANTAGE_KEY=Q4DQGD7ASEM0INDB
      - GROK_KEY=${GROK_KEY}
      - HUGGING_FACE_TOKEN=${HUGGING_FACE_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    dns:
      - 8.8.8.8
      - 8.8.4.4
    command: sh -c "sleep 10 && python run.py"

  frontend:
    build: ./client
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_BASE_URL=http://3.85.3.252:5001
    depends_on:
      - backend
    dns:
      - 8.8.8.8
      - 8.8.4.4

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=stock_analyzer_database
      - POSTGRES_USER=zeller
      - POSTGRES_PASSWORD=june1200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeller -d stock_analyzer_database"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  postgres_data:
  redis_data:
